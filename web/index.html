`;
var st=document.createElement("style");st.textContent=CSS;document.head.appendChild(st);

var shell=document.createElement("div");shell.className="shell";
shell.innerHTML='<div class="main"><div class="view on"><div class="boot" id="ybd-boot">Loading your wedding…</div></div></div>';
app.appendChild(shell);

/* ---------- helpers ---------- */
function esc(s){return(""+s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ampName(s){return(""+s).split("&").map(function(p){return esc(p.trim());}).join(' <span class="amp">&amp;</span> ');}
function norm(s){return(""+s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s'-]/g," ").replace(/\s+/g," ").trim();}
function toDate(v){if(!v)return null;if(v instanceof Date)return v;var d=new Date(String(v));return isNaN(d)?null:d;}
function fmtDate(d){try{return d.toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}catch(e){return "";}}
function boot(msg){var b=app.querySelector("#ybd-boot");if(b)b.textContent=msg;}
function apiGet(qs){return fetch(API+"?"+qs).then(function(r){return r.json();});}
function apiPost(payload){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){return r.json();});}

var IC={
rsvp:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
seat:'<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
menu:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
photos:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 6l1.5-2h5L16 6"/><circle cx="12" cy="12.5" r="3.5"/></svg>'
};
var LABELS={rsvp:["RSVP","Let us know you’re coming"],seat:["Find your seat","Which table am I on?"],menu:["Menu & timeline","The food & the day"],photos:["Photos","Share your snaps"]};
function tl(rows){return '<ul class="tl">'+rows.map(function(r){return '<li><span class="tm">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></li>';}).join("")+'</ul>';}

/* ---------- boot: slug from path -> fetch event ---------- */
var slug=decodeURIComponent((location.pathname||"").replace(/^\/+|\/+$/g,"").split("/")[0]||"");
if(!slug){
  shell.innerHTML='<div class="main"><div class="view on"><div class="landing"><img src="https://i0.wp.com/yourbigday.events/wp-content/uploads/2024/01/image_123650291.jpg" alt="Your Big Day"><h1>Your Big Day</h1><p>This is a wedding experience platform. If you’re a guest, please open the personal link the couple shared with you.</p><p style="margin-top:1rem"><a href="https://yourbigday.events">yourbigday.events</a></p></div></div></div>';
  return;
}
var INVITE=[];
apiGet("action=event&slug="+encodeURIComponent(slug)).then(function(resp){
  if(!resp||!resp.ok||!resp.event){boot("This wedding could not be found. Please check your link.");return;}
  EVENTCODE=resp.event.event_code||"";
  INVITE=(resp.guests||[]).map(function(g){return {name:(""+(g.name||"")).trim(),household:(""+(g.household||"")).trim()||(""+(g.name||"")).trim(),tno:Number(g.table_number)||0,tname:(""+(g.table_name||"")).trim()};}).filter(function(g){return g.name;});
  try{render(buildConfig(resp.event));}catch(e){boot("Something went wrong loading this wedding.");}
}).catch(function(){boot("We couldn’t load this wedding. Please refresh.");});
setTimeout(function(){var b=app.querySelector("#ybd-boot");if(b&&/Loading/.test(b.textContent))boot("Taking longer than usual — please refresh.");},9000);

function buildConfig(e){
  var feats=(Array.isArray(e.features)&&e.features.length)?e.features.map(norm).filter(Boolean):["rsvp","seat","menu","photos"];
  return {
    couple:e.couple_names||"",
    logo:e.logo||"https://i0.wp.com/yourbigday.events/wp-content/uploads/2024/01/image_123650291.jpg",
    photo:e.hero_photo||"",
    dateMeta:e.date_meta||"",
    iso:e.wedding_iso||"",
    theme:norm(e.theme||"editorial"),
    features:feats,
    wedibox:e.wedibox_url||"",
    venue:e.venue_text||"",
    story:Array.isArray(e.story)?e.story:[],
    order:Array.isArray(e.order_of_day)?e.order_of_day:[],
    menu:Array.isArray(e.menu)?e.menu:[],
    menuOrder:Array.isArray(e.menu_order)?e.menu_order:[]
  };
}

/* ---------- render ---------- */
function render(CFG){
  var has={};CFG.features.forEach(function(f){has[f]=true;});
  var order=["rsvp","seat","menu","photos"];
  var cards=order.filter(function(f){return has[f];}).map(function(f){
    return '<div class="act" data-go="'+f+'">'+IC[f]+'<div class="t">'+LABELS[f][0]+'</div><div class="d">'+LABELS[f][1]+'</div></div>';
  }).join("");

  var heroStyle=CFG.photo?(' photohero" style="background-image:linear-gradient(rgba(27,26,22,.28),rgba(27,26,22,.62)),url(\''+CFG.photo+'\')"'):'"';
  var sections="";
  if(CFG.story&&CFG.story.length)sections+='<div class="section"><div class="kicker">Our love story</div><h2>How it all began</h2>'+CFG.story.map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+'</div>';
  if(CFG.order&&CFG.order.length)sections+='<div class="section"><div class="kicker">The day</div><h2>Order of the day</h2>'+tl(CFG.order)+'</div>';
  if(CFG.venue)sections+='<div class="section"><div class="kicker">Getting there</div><h2>Venue & travel</h2><p>'+esc(CFG.venue)+'</p></div>';

  var wd=toDate(CFG.iso);
  var metaText=CFG.dateMeta||(wd?fmtDate(wd):"");
  var home='<div class="view on" data-id="home">'
  +'<div class="hero'+heroStyle+'><div class="pre">We’re getting married</div>'
  +'<h1>'+ampName(CFG.couple)+'</h1>'
  +(metaText?'<div class="meta">'+esc(metaText)+'</div>':'')
  +'<div class="cd" id="ybd-cd"></div></div>'
  +(cards?'<div class="acts">'+cards+'</div>':'')
  +'<div class="col">'+sections
  +'<div class="foot">Have your wedding coming up? Set up your digital experience with <a href="https://yourbigday.events/contact-us/"><b>Your Big Day</b></a></div>'
  +'</div></div>';

  var seat=has.seat?('<div class="view" data-id="seat"><div class="col pad finder">'
  +'<div class="kicker">Find your seat</div><div class="lab">Where am I sitting?</div>'
  +'<div class="field"><input id="ybd-sq" type="search" placeholder="Start typing your name" autocomplete="off" aria-label="Find your seat"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>'
  +'<div class="result" id="ybd-seat-out"></div><div class="seatstatus" id="ybd-seat-status"></div>'
  +'</div></div>'):'';

  var menu="";
  if(has.menu){
    function itemHtml(it){return '<div class="d">'+esc(it.d)+(it.tag?' <span class="tag">'+esc(it.tag)+'</span>':'')+'</div>'+(it.n?'<div class="n">'+esc(it.n)+'</div>':'');}
    var courses=(CFG.menu||[]).map(function(co){var body=(co.items||[]).map(itemHtml).join(co.alt?'<div class="altw">alternating with</div>':'');return '<div class="course"><div class="c">'+esc(co.c)+'</div>'+body+'</div>';}).join("");
    menu='<div class="view" data-id="menu"><div class="col pad">'
    +'<div class="kicker">At your table</div><h2>The menu</h2>'
    +'<div style="margin-top:1rem">'+courses+'</div>'
    +(CFG.menuOrder&&CFG.menuOrder.length?'<h2 style="margin-top:2.2rem">Running order</h2>'+tl(CFG.menuOrder):'')
    +'</div></div>';
  }

  var rsvp=has.rsvp?'<div class="view" data-id="rsvp"><div class="col pad finder rsvp"><div class="kicker">RSVP</div><div class="lab">Will you join us?</div><div id="ybd-rsvp-body"></div><div class="seatstatus" id="ybd-rsvp-status"></div></div></div>':'';

  var photos=has.photos?('<div class="view" data-id="photos"><div class="col pad">'
  +'<div class="kicker">Shared album</div><h2>Photos</h2>'
  +'<p class="phintro">Add your snaps from the day — everyone’s photos, all in one place.</p>'
  +'<input type="file" id="ybd-ph-input" accept="image/*" multiple style="display:none">'
  +'<button type="button" class="rsvpbtn" id="ybd-ph-add" style="max-width:18rem;margin:0 auto">Add photos</button>'
  +'<div class="seatstatus" id="ybd-ph-status" style="text-align:center"></div>'
  +'<div class="phgrid" id="ybd-ph-grid"></div>'
  +'</div></div>'):'';

  shell.innerHTML='<div class="bar">'
  +'<button type="button" class="back" id="ybd-back">← Back</button>'
  +'<button type="button" class="brand" data-go="home" aria-label="Home"><img src="'+CFG.logo+'" alt="Your Big Day"><span class="wm">Your Big Day</span></button>'
  +'</div><div class="main">'+home+seat+menu+rsvp+photos+'</div>';

  var back=app.querySelector("#ybd-back");
  function go(id){
    [].forEach.call(app.querySelectorAll(".view"),function(v){v.classList.toggle("on",v.getAttribute("data-id")===id);});
    back.classList.toggle("on",id!=="home");
    var v=app.querySelector('.view[data-id="'+id+'"]');if(v)v.scrollTop=0;
    var fr=v?v.querySelector("iframe[data-src]"):null;
    if(fr&&!fr.getAttribute("src"))fr.setAttribute("src",fr.getAttribute("data-src"));
    if(id==="seat")seatInit();
    if(id==="rsvp")rsvpInit();
    if(id==="photos")photosInit();
  }
  [].forEach.call(app.querySelectorAll("[data-go]"),function(el){el.addEventListener("click",function(){go(el.getAttribute("data-go"));});});
  back.addEventListener("click",function(){go("home");});

  (function(){var el=app.querySelector("#ybd-cd");if(!el||!wd)return;var days=Math.max(0,Math.ceil((wd-new Date())/86400000));el.textContent=days===0?"Today is the day":(days+(days===1?" day to go":" days to go"));})();

  /* ===== shared matching ===== */
  function lev(a,b){var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var p=[],c=[],i,j;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){c[0]=i;for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));var t=p;p=c;c=t;}return p[n];}
  function mtch(name,q){var n=norm(name),query=norm(q);if(!query)return 0;if(n===query)return 100;if(n.indexOf(query)===0)return 90;var t=n.split(" ");for(var i=0;i<t.length;i++)if(t[i].indexOf(query)===0)return 80;if(n.indexOf(query)>-1)return 65;for(var k=0;k<t.length;k++){var d=lev(t[k],query);if(query.length>=4&&d<=1)return 55;if(query.length>=6&&d<=2)return 45;}return 0;}
  function partyFor(household){return INVITE.filter(function(g){return norm(g.household)===norm(household);});}

  /* ===== seat ===== */
  var GUESTS=[],BYNO={},CHOICES=[],seatStarted=false,sq,outEl,statusEl;
  function seatStatus(big,small){if(!statusEl)return;statusEl.innerHTML=big?('<div class="big">'+big+'</div>'+(small?'<div>'+small+'</div>':'')):"";}
  function clearOut(){outEl.className="result";outEl.innerHTML="";}
  function showGuest(g){var t=BYNO[g.tno]||{no:g.tno,name:g.tname,guests:[g.name]};var mates=t.guests.map(function(n){var self=norm(n)===norm(g.name);return '<li class="'+(self?"self":"")+'">'+esc(n)+(self?" (you)":"")+'</li>';}).join("");outEl.innerHTML='<div class="you">'+esc(g.name)+'</div><div class="seat"><span class="tno">Table '+g.tno+'</span> — '+esc(t.name)+'</div><div class="mates"><div class="ml">Seated with</div><ul>'+mates+'</ul></div>';outEl.className="result on";}
  function showChoices(list){CHOICES=list;var b=list.map(function(g,i){return '<button type="button" class="choice" data-i="'+i+'">'+esc(g.name)+'</button>';}).join("");outEl.innerHTML='<div class="nomatch" style="font-size:1.2rem;margin-bottom:.6rem">A few names match — which one are you?</div>'+b;outEl.className="result on";}
  function searchSeat(q){clearOut();if(!q.trim())return;var hits=[];GUESTS.forEach(function(g){var s=mtch(g.name,q);if(s>0)hits.push({g:g,s:s});});if(!hits.length){outEl.innerHTML='<div class="nomatch">We couldn’t find that name.<small>Try your first or last name, or check with the couple.</small></div>';outEl.className="result on";return;}hits.sort(function(a,b){return b.s-a.s;});var best=hits[0].s;var top=hits.filter(function(h){return h.s===best;});if(top.length===1)showGuest(top[0].g);else showChoices(top.map(function(h){return h.g;}));}
  function seatInit(){
    if(seatStarted)return;seatStarted=true;
    sq=app.querySelector("#ybd-sq");outEl=app.querySelector("#ybd-seat-out");statusEl=app.querySelector("#ybd-seat-status");
    var tmr;sq.addEventListener("input",function(e){clearTimeout(tmr);tmr=setTimeout(function(){if(GUESTS.length)searchSeat(e.target.value);},110);});
    outEl.addEventListener("click",function(e){var b=e.target.closest?e.target.closest(".choice"):null;if(!b)return;var g=CHOICES[Number(b.getAttribute("data-i"))];if(g)showGuest(g);});
    var wt=INVITE.filter(function(g){return g.tno;});
    if(!INVITE.length){seatStatus("Seating chart not found","Please check your link, or ask the couple.");return;}
    if(!wt.length){seatStatus("Seating opens closer to the day","Tables are assigned once RSVPs are in — please check back.");return;}
    GUESTS=wt;BYNO={};wt.forEach(function(r){if(!BYNO[r.tno])BYNO[r.tno]={no:r.tno,name:r.tname,guests:[]};BYNO[r.tno].guests.push(r.name);});seatStatus("","");
  }

  /* ===== rsvp ===== */
  var rsvpStarted=false,RBODY,RSTATUS,PARTY=null,RCHOICES=[];
  var MEALS=(CFG.menu||[]).filter(function(co){return co.alt&&co.items&&co.items.length>1;}).map(function(co){return {course:co.c,options:co.items.map(function(it){return it.d;})};});
  var LSKEY="ybd_rsvp_"+EVENTCODE;
  function lsGet(){try{return JSON.parse(localStorage.getItem(LSKEY)||"null");}catch(e){return null;}}
  function lsSet(o){try{localStorage.setItem(LSKEY,JSON.stringify(o));}catch(e){}}
  function lsClear(){try{localStorage.removeItem(LSKEY);}catch(e){}}
  function rstatus(msg){if(RSTATUS)RSTATUS.innerHTML=msg?('<div>'+msg+'</div>'):"";}
  function rsvpSearchStep(){RBODY.innerHTML='<div class="field"><input id="ybd-rq" type="search" placeholder="Start typing your name" autocomplete="off" aria-label="Your name"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><div class="result" id="ybd-rout"></div>';var rq=app.querySelector("#ybd-rq"),rout=app.querySelector("#ybd-rout");var tmr;rq.addEventListener("input",function(e){clearTimeout(tmr);tmr=setTimeout(function(){rsvpSearch(e.target.value,rout);},110);});rout.addEventListener("click",function(e){var b=e.target.closest?e.target.closest(".choice"):null;if(!b)return;var g=RCHOICES[Number(b.getAttribute("data-i"))];if(g)openParty(g.household);});}
  function rsvpSearch(q,rout){rout.className="result";rout.innerHTML="";if(!q.trim())return;var hits=[];INVITE.forEach(function(g){var s=mtch(g.name,q);if(s>0)hits.push({g:g,s:s});});if(!hits.length){rout.innerHTML='<div class="nomatch">We couldn’t find that name.<small>Try your first or last name, or check with the couple.</small></div>';rout.className="result on";return;}hits.sort(function(a,b){return b.s-a.s;});var best=hits[0].s;var top=hits.filter(function(h){return h.s===best;}).map(function(h){return h.g;});if(top.length===1){openParty(top[0].household);return;}RCHOICES=top;rout.innerHTML='<div class="nomatch" style="font-size:1.2rem;margin-bottom:.6rem">Which one are you?</div>'+top.map(function(g,i){return '<button type="button" class="choice" data-i="'+i+'">'+esc(g.name)+(norm(g.household)!==norm(g.name)?' <span style="color:#8B857A">· '+esc(g.household)+'</span>':'')+'</button>';}).join("");rout.className="result on";}
  function openParty(household){var members=partyFor(household);if(!members.length){rsvpSearchStep();return;}PARTY={household:household,members:members};confirmStep();}
  function confirmStep(){var mem=PARTY.members.map(function(g){return '<li>'+esc(g.name)+'</li>';}).join("");RBODY.innerHTML='<div class="kicker">Your invitation</div><div class="rhh">'+esc(PARTY.household)+'</div><ul class="rmembers">'+mem+'</ul><button type="button" class="rsvpbtn" id="ybd-rc-yes">That’s us — continue</button><div style="text-align:center"><button type="button" class="rlink" id="ybd-rc-no">Not us? Search again</button></div>';app.querySelector("#ybd-rc-yes").addEventListener("click",function(){formStep(null);});app.querySelector("#ybd-rc-no").addEventListener("click",function(){PARTY=null;rsvpSearchStep();});}
  function formStep(prefill){
    var pmap={};if(prefill)prefill.forEach(function(p){pmap[norm(p.name)]=p;});
    var rows=PARTY.members.map(function(g,i){
      var pf=pmap[norm(g.name)]||{};
      var att=(pf.attending==="yes"||pf.attending===true)?true:((pf.attending==="no"||pf.attending===false)?false:null);
      var mealsel={};if(pf.meal){(""+pf.meal).split("|").forEach(function(seg){var idx=seg.indexOf(":");if(idx>-1)mealsel[norm(seg.slice(0,idx))]=seg.slice(idx+1).trim();});}
      var mealHtml=MEALS.map(function(mc,mi){var opts='<option value="">Select…</option>'+mc.options.map(function(o){return '<option'+(mealsel[norm(mc.course)]===o?' selected':'')+'>'+esc(o)+'</option>';}).join("");return '<label>'+esc(mc.course)+'</label><select data-meal="'+mi+'">'+opts+'</select>';}).join("");
      return '<div class="rr" data-i="'+i+'"><div class="nm">'+esc(g.name)+'</div><div class="seg"><button type="button" data-att="yes"'+(att===true?' class="on"':'')+'>Attending</button><button type="button" data-att="no"'+(att===false?' class="on"':'')+'>Can’t make it</button></div><div class="rf mealwrap"'+(att===true?'':' style="display:none"')+'>'+mealHtml+'<label>Dietary needs (optional)</label><input type="text" data-diet value="'+esc(pf.dietary||"")+'" placeholder="Allergies, preferences…"></div></div>';
    }).join("");
    RBODY.innerHTML='<div class="kicker">'+esc(PARTY.household)+'</div><div style="margin:.3rem 0 1rem;color:#8B857A;font-size:.9rem">Let us know who’s coming'+(MEALS.length?' and choose each meal':'')+'.</div>'+rows+'<div class="rf"><label>Note to the couple (optional)</label><input type="text" id="ybd-rmsg" placeholder="Anything you’d like them to know"></div><button type="button" class="rsvpbtn" id="ybd-rsub">Save our RSVP</button><div style="text-align:center"><button type="button" class="rlink" id="ybd-rstart">This isn’t us — start over</button></div>';
    [].forEach.call(app.querySelectorAll(".rr"),function(rr){var seg=rr.querySelector(".seg"),wrap=rr.querySelector(".mealwrap");seg.addEventListener("click",function(e){var b=e.target.closest?e.target.closest("button[data-att]"):null;if(!b)return;[].forEach.call(seg.querySelectorAll("button"),function(x){x.classList.remove("on");});b.classList.add("on");wrap.style.display=(b.getAttribute("data-att")==="yes")?"block":"none";});});
    app.querySelector("#ybd-rsub").addEventListener("click",submitRsvp);
    app.querySelector("#ybd-rstart").addEventListener("click",function(){PARTY=null;lsClear();rsvpSearchStep();});
  }
  function submitRsvp(){
    var guests=[],ok=true;
    [].forEach.call(app.querySelectorAll(".rr"),function(rr){var g=PARTY.members[Number(rr.getAttribute("data-i"))];var on=rr.querySelector(".seg button.on");var attending=on?(on.getAttribute("data-att")==="yes"):null;var meal="",dietary="";if(attending===true){var parts=[];[].forEach.call(rr.querySelectorAll("select[data-meal]"),function(sel){var mi=Number(sel.getAttribute("data-meal"));if(sel.value)parts.push(MEALS[mi].course+": "+sel.value);});meal=parts.join(" | ");var di=rr.querySelector("input[data-diet]");dietary=di?di.value.trim():"";}if(attending===null)ok=false;guests.push({name:g.name,attending:attending,meal:meal,dietary:dietary});});
    if(!ok){rstatus("Please choose Attending or Can’t make it for everyone.");return;}
    var msgEl=app.querySelector("#ybd-rmsg"),message=msgEl?msgEl.value.trim():"";
    var btn=app.querySelector("#ybd-rsub");if(btn){btn.disabled=true;btn.textContent="Saving…";}rstatus("");
    var payload={household:PARTY.household,guests:guests.map(function(x){return {name:x.name,attending:x.attending?"yes":"no",meal:x.meal,dietary:x.dietary};})};
    apiPost({action:"rsvp_submit",e:EVENTCODE,household:PARTY.household,message:message,guests:payload.guests}).then(function(r){
      if(r&&r.ok){lsSet({household:PARTY.household,guests:payload.guests,ts:Date.now()});doneStep();}
      else{if(btn){btn.disabled=false;btn.textContent="Save our RSVP";}rstatus("Sorry, that didn’t save — please try again.");}
    }).catch(function(){if(btn){btn.disabled=false;btn.textContent="Save our RSVP";}rstatus("Sorry, that didn’t save — please check your connection and try again.");});
  }
  function doneStep(){RBODY.innerHTML='<div class="rdone"><div class="big">Thank you — you’re all set</div><p class="rnote">Your RSVP for '+esc(PARTY.household)+' has been saved. You can change it any time from this device.</p><button type="button" class="rsvpbtn" id="ybd-redit" style="max-width:16rem;margin:1.4rem auto 0">Edit our reply</button></div>';app.querySelector("#ybd-redit").addEventListener("click",function(){var s=lsGet();formStep(s?s.guests:null);});}
  function rsvpInit(){
    if(rsvpStarted)return;rsvpStarted=true;
    RBODY=app.querySelector("#ybd-rsvp-body");RSTATUS=app.querySelector("#ybd-rsvp-status");
    if(!INVITE.length){RBODY.innerHTML='<div class="nomatch">We couldn’t load the guest list.<small>Please refresh, or check with the couple.</small></div>';return;}
    var saved=lsGet();
    if(saved&&saved.household){
      var members=partyFor(saved.household);
      if(!members.length){rsvpSearchStep();return;}
      PARTY={household:saved.household,members:members};
      rstatus("Loading…");
      apiGet("action=rsvp_get&e="+encodeURIComponent(EVENTCODE)+"&h="+encodeURIComponent(saved.household)).then(function(r){rstatus("");formStep(r&&r.ok&&r.guests&&r.guests.length?r.guests:saved.guests);}).catch(function(){rstatus("");formStep(saved.guests);});
      return;
    }
    rsvpSearchStep();
  }

  /* ===== photos (native Supabase album) ===== */
  var photosStarted=false,PHLIGHT=null;
  function openLight(url){if(!PHLIGHT){PHLIGHT=document.createElement("div");PHLIGHT.className="phlight";PHLIGHT.innerHTML='<button type="button" class="x" aria-label="Close">×</button><img alt="">';app.appendChild(PHLIGHT);PHLIGHT.addEventListener("click",function(){PHLIGHT.classList.remove("on");});}PHLIGHT.querySelector("img").src=url;PHLIGHT.classList.add("on");}
  function photosInit(){
    if(photosStarted)return;photosStarted=true;
    var add=app.querySelector("#ybd-ph-add"),input=app.querySelector("#ybd-ph-input"),grid=app.querySelector("#ybd-ph-grid"),status=app.querySelector("#ybd-ph-status");
    add.addEventListener("click",function(){input.click();});
    input.addEventListener("change",function(){var files=[].slice.call(input.files||[]);input.value="";if(files.length)uploadFiles(files);});
    grid.addEventListener("click",function(e){var img=e.target.closest?e.target.closest("img"):null;if(img)openLight(img.getAttribute("data-full"));});
    loadPhotos();
    function loadPhotos(){
      grid.innerHTML='<div class="phempty">Loading photos…</div>';
      apiGet("action=photo_list&e="+encodeURIComponent(EVENTCODE)).then(function(r){
        if(!r||!r.ok){grid.innerHTML='<div class="phempty">Couldn’t load the album — please refresh.</div>';return;}
        var photos=r.photos||[];
        if(!photos.length){grid.innerHTML='<div class="phempty">No photos yet — be the first to add one.</div>';return;}
        grid.innerHTML=photos.map(function(p){return '<img loading="lazy" src="'+esc(p.url)+'" data-full="'+esc(p.url)+'" alt="">';}).join("");
      }).catch(function(){grid.innerHTML='<div class="phempty">Couldn’t load the album — please refresh.</div>';});
    }
    function uploadOne(file){
      return apiPost({action:"photo_sign",e:EVENTCODE,filename:file.name,contentType:file.type||"application/octet-stream"}).then(function(r){
        if(!r||!r.ok||!r.signedUrl)throw new Error("sign");
        return fetch(r.signedUrl,{method:"PUT",headers:{"content-type":file.type||"application/octet-stream","x-upsert":"true"},body:file}).then(function(resp){if(!resp.ok)throw new Error("put "+resp.status);});
      });
    }
    function uploadFiles(files){
      var total=files.length,done=0,fail=0;
      add.disabled=true;
      status.innerHTML="<div>Uploading 0 / "+total+"…</div>";
      var seq=Promise.resolve();
      files.forEach(function(file){
        seq=seq.then(function(){return uploadOne(file).then(function(){done++;},function(){fail++;}).then(function(){status.innerHTML="<div>Uploading "+(done+fail)+" / "+total+"…</div>";});});
      });
      seq.then(function(){add.disabled=false;status.innerHTML="<div>"+(fail?(done+" added, "+fail+" couldn’t upload."):(done+" photo"+(done===1?"":"s")+" added — thank you!"))+"</div>";loadPhotos();setTimeout(function(){status.innerHTML="";},4500);});
    }
  }
}
})();
</script>
</body>
</html>
